services:
  trip-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - HTTP_ADDR=:8080
      - DATABASE_URL=postgres://tripgo:tripgo@host.docker.internal:23032/tripgo?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:23318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - PUSH_HTTP_URL=http://host.docker.internal:23809
      - IDEMPOTENCY_KEY_RETENTION=24h
      - HTTP_READ_TIMEOUT=5s
      - HTTP_READ_HEADER_TIMEOUT=2s
      - HTTP_WRITE_TIMEOUT=10s
      - HTTP_IDLE_TIMEOUT=60s
    env_file:
      - ../.env
    ports:
      - "8080:8080"
